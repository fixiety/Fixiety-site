<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/png" href="https://horizons-cdn.hostinger.com/90802552-2955-43cb-b62b-328449576777/82b017e603437d17912d5377fcb543de.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>FIXIETY</title>
	</head>
	<body>
		<div id="root"></div>
		<script>
			window.addEventListener('error', function (event) {
				var root = document.getElementById('root');
				if (!root || root.dataset.mounted === 'true') return;
				root.innerHTML =
					'<div style="min-height:100dvh;background:#000;color:#fff;padding:1.5rem;font-family:system-ui,sans-serif;">' +
					'<strong>FIXIETY BOOT ERROR</strong><pre style="white-space:pre-wrap;margin-top:1rem;">' +
					(event.error && event.error.stack ? event.error.stack : event.message) +
					'</pre></div>';
			});
		</script>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
